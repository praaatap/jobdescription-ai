name: Build Extension

on:
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Build extension
              run: npm run build

            - name: Create ZIP archive
              run: |
                  cd dist
                  zip -r ../jobfit-ai-extension.zip .
                  cd ..

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: jobfit-ai-extension
                  path: jobfit-ai-extension.zip
