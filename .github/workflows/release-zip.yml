name: Build and Release Extension

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0
  workflow_dispatch:  # Allows manual trigger

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci
      
      # Step 4: Build the extension
      - name: Build extension
        run: npm run build
      
      # Step 5: Create ZIP file
      - name: Create ZIP archive
        run: |
          cd dist
          zip -r ../resume-analyzer-pro-${{ github.ref_name }}.zip .
          cd ..
      
      # Step 6: Create GitHub Release
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Resume Analyzer Pro ${{ github.ref_name }}
          body: |
            ## 🚀 Release ${{ github.ref_name }}
            
            ### 📦 Installation
            1. Download `resume-analyzer-pro-${{ github.ref_name }}.zip`
            2. Extract the ZIP file
            3. Open Chrome → `chrome://extensions/`
            4. Enable Developer Mode
            5. Click "Load unpacked"
            6. Select the extracted folder
            
            ### ✨ What's New
            - See CHANGELOG.md for details
            
            ### 🐛 Bug Fixes
            - See commit history
          draft: false
          prerelease: false
      
      # Step 7: Upload ZIP to release
      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./resume-analyzer-pro-${{ github.ref_name }}.zip
          asset_name: resume-analyzer-pro-${{ github.ref_name }}.zip
          asset_content_type: application/zip
      
      # Step 8: Upload source code
      - name: Upload Source ZIP
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./resume-analyzer-pro-${{ github.ref_name }}.zip
          asset_name: source-code.zip
          asset_content_type: application/zip
